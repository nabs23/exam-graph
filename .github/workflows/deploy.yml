name: Build and Deploy ExamGraph

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/exam-graph:latest
          build-args: |
            VITE_APP_NAME=ExamGraph
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/exam-graph:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/exam-graph:buildcache,mode=max

      - name: Trigger Coolify deployment
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK_EXAM_GRAPH: ${{ secrets.COOLIFY_WEBHOOK_EXAM_GRAPH }}
        run: |
          curl --fail --show-error --silent --location \
            --request POST \
            --connect-timeout 15 \
            --max-time 45 \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 5 \
            "$COOLIFY_WEBHOOK_EXAM_GRAPH" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"
